<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center">Upload SKU Files</h2>

    {% if message %}
        <div class="alert alert-success">{{ message }}</div>
    {% elif error_message %}
        <div class="alert alert-warning">{{ error_message }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="border p-4 shadow">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Upload SKU Price File</label>
            <input type="file" class="form-control" name="sku_price_file" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Upload SKU Detail File</label>
            <input type="file" class="form-control" name="sku_detail_file" required>
        </div>

        <button type="submit" class="btn btn-primary">Upload</button>
    </form>

    {% if chart %}
    <div class="mt-5">
        <h3 class="text-center">Sales Forecast Graph</h3>
        <div class="text-center">
            <img src="{{ chart }}" class="img-fluid border shadow" alt="Sales Forecast Chart">
        </div>
    </div>
    {% endif %}

    {% if file_available %}
    <div class="text-center mt-4">
        <a href="{% url 'download_file' %}" class="btn btn-success">Download Excel File</a>
    </div>
    {% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
